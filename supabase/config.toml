project_id = "harikrupa-lpo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false
# Sign-up is disabled: accounts are provisioned by an admin (section 6/48),
# not via public self-registration.

[edge_runtime]
enabled = true

[functions.generate-lpo-pdf]
verify_jwt = true

[functions.send-lpo-email]
verify_jwt = true

[functions.send-lpo-sms]
verify_jwt = true

[functions.approve-lpo]
verify_jwt = true
